# PlanRight — single Worker: static frontend + JSON API + D1
# For local development: run `npx wrangler d1 execute planright-db --local` first,
# then copy the generated database_id back into this file.
# For the Deploy button: leave bindings without ids so Workers creates fresh resources.

name = "planright-v21"
main = "worker/index.ts"
compatibility_date = "2026-10-04"

# Serve the Next.js static export (out/) from the same Worker origin.
[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Data: tasks, projects, notes, templates.
[[d1_databases]]
binding = "DB"
database_name = "planright-v21-db"
database_id = ""
